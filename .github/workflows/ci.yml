name: Validate game
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Rust and WebAssembly target
        run: rustup toolchain install 1.93.0 --profile minimal --target wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: rust/flight-core/target
          key: ${{ runner.os }}-${{ runner.arch }}-flight-core-${{ hashFiles('rust-toolchain.toml', 'rust/flight-core/Cargo.toml', 'rust/flight-core/Cargo.lock', 'rust/flight-core/src/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-flight-core-
      - run: npm ci
      - run: npm run check
      - run: npm run build
